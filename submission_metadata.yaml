# ============================================================================
# AI tools declaration (transparency only — declared use is NOT penalized)
# ============================================================================
ai_tools_used:
  - "Claude"

ai_usage_summary: |
  Used Claude (Claude Code) as a pair-programming and code-review assistant:
  scaffolding the pipeline, the .gz loader, the deterministic data-derived REF_DATE,
  the sort key, the gate-on-top structure, and the validator-safe CSV writer; and as a
  sounding board for design choices. The graded substance — the career-history
  relevance scorer, role/AI-depth/experience/behavioral signals, the saturating
  normalization and weights, the hard-negative gates and their strengths, and the
  honeypot detector — I designed and tuned against the real data myself, with Claude
  as a sounding board on tradeoffs. No candidate data was sent to any hosted LLM; the
  ranker makes no API calls.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Unsupervised, hand-encoded ranker (Python stdlib only, ~26s on 100K, CPU/no-network).
  Five positive signals — career-history relevance (reads what each role actually did,
  highest weight), role-relevance tier, corroborated AI-skill depth, experience band,
  behavioral availability — normalized to [0,1] and blended additively. Career and AI
  depth use a saturating x/(x+K) transform with K read off each feature's own
  distribution. Four hard negatives (keyword-stuffer, services-only career, CV/speech-
  primary, recent-LLM-only) apply as multiplicative gates outside the blend so strong
  positives can't average them away. A high-precision honeypot detector runs as an
  end-gate over the top ranks. Deterministic: time math anchored to a data-derived
  REF_DATE, ties broken by candidate_id; two runs are byte-identical.

